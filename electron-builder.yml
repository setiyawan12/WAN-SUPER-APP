appId: com.wan.superapp
productName: WAN Super App
directories:
  output: dist
  buildResources: build

# Published to GitHub Releases by CI (electron-builder --publish always).
# EDIT owner/repo to your GitHub repository before tagging a release.
publish:
  provider: github
  owner: setiyawan12
  repo: WAN-SUPER-APP

files:
  - out/**
  - package.json

mac:
  # cloudflared (arm64) downloaded by CI into modules/net/cloudflared
  extraResources:
    - from: modules/net/cloudflared
      to: cloudflared
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarize via notarytool. teamId must be explicit (electron-builder 24 does
  # NOT auto-read APPLE_TEAM_ID for it); APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
  # are still read from env by @electron/notarize.
  notarize:
    teamId: ${env.APPLE_TEAM_ID}

win:
  extraResources:
    - from: modules/net/cloudflared.exe
      to: cloudflared.exe
  target:
    - nsis

linux:
  extraResources:
    - from: modules/net/cloudflared
      to: cloudflared
  target:
    - AppImage
    - deb
  category: Development
  executableName: wan-super-app
