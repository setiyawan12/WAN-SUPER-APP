appId: com.wan.superapp
productName: WAN Super App
directories:
  output: dist
  buildResources: build

# Custom notarization (retryable notarytool + staple). Replaces electron-builder's
# built-in notarize, which crashes on Apple's intermittent non-JSON HTTP errors.
afterSign: build/notarize.cjs

# Published to GitHub Releases by CI (electron-builder --publish always).
# EDIT owner/repo to your GitHub repository before tagging a release.
publish:
  provider: github
  owner: setiyawan12
  repo: WAN-SUPER-APP

files:
  - out/**
  - package.json

mac:
  # cloudflared (arm64) downloaded by CI into modules/net/cloudflared
  extraResources:
    - from: modules/net/cloudflared
      to: cloudflared
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization handled by the afterSign hook (build/notarize.cjs) with retry.
  notarize: false

win:
  extraResources:
    - from: modules/net/cloudflared.exe
      to: cloudflared.exe
  target:
    - nsis

linux:
  # Required for the .deb package (Debian needs a maintainer). Edit to your own.
  maintainer: WAN <absenkudev@gmail.com>
  extraResources:
    - from: modules/net/cloudflared
      to: cloudflared
  target:
    - AppImage
    - deb
  category: Development
  executableName: wan-super-app
