appId: com.wan.superapp
productName: WAN Super App
directories:
  output: dist
  buildResources: build

# Custom notarization (retryable notarytool + staple). Replaces electron-builder's
# built-in notarize, which crashes on Apple's intermittent non-JSON HTTP errors.
afterSign: build/notarize.cjs

# Published to GitHub Releases by CI (electron-builder --publish always).
# EDIT owner/repo to your GitHub repository before tagging a release.
publish:
  provider: github
  owner: setiyawan12
  repo: WAN-SUPER-APP

files:
  - out/**
  - package.json

# Native module dari modul WANN SSH tidak boleh di dalam asar (.node butuh dlopen).
asarUnpack:
  - "**/node_modules/argon2/**"
  - "**/node_modules/ssh2/**"
  - "**/node_modules/node-pty/**"

# JANGAN compile native dari source saat packaging. argon2 memakai prebuild N-API
# (ABI-stabil lintas Node/Electron) yang sudah dibundel di tarball npm, jadi tidak
# perlu Visual Studio / build tools di runner CI. Rebuild dari source justru gagal
# di Windows/Linux tanpa toolchain C++.
npmRebuild: false

mac:
  # cloudflared (arm64) downloaded by CI into modules/net/cloudflared
  extraResources:
    - from: modules/net/cloudflared
      to: cloudflared
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization handled by the afterSign hook (build/notarize.cjs) with retry.
  notarize: false

win:
  extraResources:
    - from: modules/net/cloudflared.exe
      to: cloudflared.exe
  target:
    - nsis

linux:
  # Required for the .deb package (Debian needs a maintainer). Edit to your own.
  maintainer: WAN <absenkudev@gmail.com>
  # Bake --no-sandbox into the generated .desktop Exec line. Chromium's setuid
  # sandbox can't work in AppImage (FUSE) or on kernels that restrict user
  # namespaces, so GUI launches must pass it up front. Without this, the app
  # relaunches itself with the flag and GNOME's systemd app-scope kills the
  # relaunched child when the first process exits — the window never appears.
  # (Terminal launches via /usr/bin bypass the .desktop and are covered by the
  # in-app relaunch guard in src/main/index.ts.)
  executableArgs:
    - "--no-sandbox"
  extraResources:
    - from: modules/net/cloudflared
      to: cloudflared
  target:
    - AppImage
    - deb
  category: Development
  executableName: wan-super-app
