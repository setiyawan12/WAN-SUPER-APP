<?xml version="1.0" encoding="UTF-8"?>
<!-- Template-friendly monochrome mark for macOS menu bar / system tray -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="g" x1="20" y1="16" x2="110" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8EE"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile silhouette (reads at 16–22px) -->
  <rect x="10" y="10" width="108" height="108" rx="28" ry="28"
        stroke="url(#g)" stroke-width="7" fill="none" opacity="0.95"/>
  <!-- Geometric W -->
  <path
    d="M34 40 L46 90 L64 58 L82 90 L94 40"
    stroke="url(#g)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"/>
  <circle cx="64" cy="58" r="4.5" fill="#FFFFFF"/>
</svg>
