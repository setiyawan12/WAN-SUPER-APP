map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://apis.google.com https://*.firebaseio.com https://*.firebasedatabase.app; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' ws://127.0.0.1:5179 ws://localhost:5179 https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; frame-src https://*.firebaseapp.com https://*.web.app https://*.firebaseio.com https://*.firebasedatabase.app https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  # Popup Google sign-in memerlukan opener yang tetap terhubung.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  location = /healthz {
    proxy_pass http://gateway:8788/healthz;
    proxy_set_header Host $host;
  }

  location = /readyz {
    proxy_pass http://gateway:8788/readyz;
    proxy_set_header Host $host;
  }

  location = /runtime-config.json {
    proxy_pass http://gateway:8788/runtime-config.json;
    proxy_set_header Host $host;
  }

  location = /metrics {
    proxy_pass http://gateway:8788/metrics;
    proxy_set_header Host $host;
  }

  location = /v1/ws {
    proxy_pass http://gateway:8788/v1/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  # nginx tidak mewariskan add_header dari blok induk ke location yang
  # mendeklarasikan add_header sendiri, sehingga header keamanan diulang di sini.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://apis.google.com https://*.firebaseio.com https://*.firebasedatabase.app; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' ws://127.0.0.1:5179 ws://localhost:5179 https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; frame-src https://*.firebaseapp.com https://*.web.app https://*.firebaseio.com https://*.firebasedatabase.app https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  }
}