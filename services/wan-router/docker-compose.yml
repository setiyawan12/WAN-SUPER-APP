services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wan_router
      POSTGRES_USER: wan_router
      POSTGRES_PASSWORD: wan_router_dev
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wan_router -d wan_router"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - wan-router-postgres:/var/lib/postgresql/data

volumes:
  wan-router-postgres: