global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: wan-router
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/wan_metrics_token
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: wan-router
          environment: dev