<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d10" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' __WAN_ROUTER_ORIGIN__ __FIREBASE_AUTH_ORIGIN__ https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; frame-src https://accounts.google.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <style>
      html, body { margin: 0; min-height: 100%; background: #080d10; color: #e9f0f2; font-family: sans-serif; }
      .wan-web-boot { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; }
      .wan-web-boot-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 8px; background: #51d7c2; color: #05201b; font-weight: 700; }
      .wan-web-boot strong { font-size: 15px; }
      .wan-web-boot span { max-width: 360px; color: #8ca0a7; font-size: 13px; line-height: 1.5; }
      .wan-web-boot a { color: #71ead6; font-size: 13px; }
    </style>
    <title>WAN Router Cloud</title>
  </head>
  <body>
    <div id="root">
      <main class="wan-web-boot">
        <div class="wan-web-boot-mark">W</div>
        <strong>Loading WAN Router Cloud</strong>
        <span>If this screen does not change, the development server restarted while the page was loading.</span>
        <a href="/">Reload console</a>
      </main>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
