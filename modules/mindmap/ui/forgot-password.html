<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAN Case Flow — Lupa Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #06060a;
      --bg-card:     rgba(12,12,22,0.85);
      --bg-input:    rgba(255,255,255,0.04);
      --border:      rgba(255,255,255,0.07);
      --border-focus:rgba(139,124,248,0.55);
      --text-1:      rgba(255,255,255,0.92);
      --text-2:      rgba(255,255,255,0.55);
      --text-3:      rgba(255,255,255,0.28);
      --accent:      #8b7cf8;
      --accent-h:    #7c6dfa;
      --accent-dim:  rgba(139,124,248,0.18);
      --accent-glow: rgba(139,124,248,0.30);
      --error-bg:    rgba(248,113,113,0.10);
      --error-bd:    rgba(248,113,113,0.30);
      --error-txt:   #f87171;
      --ok-bg:       rgba(52,211,153,0.10);
      --ok-bd:       rgba(52,211,153,0.30);
      --ok-txt:      #34d399;
      --dot:         rgba(255,255,255,0.048);
      --shadow:      0 0 0 1px rgba(255,255,255,0.06), 0 32px 80px rgba(0,0,0,0.70);
    }
    html.light {
      --bg:          #f0f0f8;
      --bg-card:     rgba(255,255,255,0.88);
      --bg-input:    rgba(0,0,0,0.04);
      --border:      rgba(0,0,0,0.09);
      --border-focus:rgba(109,94,224,0.50);
      --text-1:      #0e0e1a;
      --text-2:      #5a5880;
      --text-3:      #9896be;
      --accent:      #6d5ee0;
      --accent-h:    #5546cc;
      --accent-dim:  rgba(109,94,224,0.10);
      --accent-glow: rgba(109,94,224,0.22);
      --error-bg:    rgba(220,38,38,0.08);
      --error-bd:    rgba(220,38,38,0.22);
      --error-txt:   #b91c1c;
      --ok-bg:       rgba(16,185,129,0.08);
      --ok-bd:       rgba(16,185,129,0.25);
      --ok-txt:      #047857;
      --dot:         rgba(0,0,0,0.055);
      --shadow:      0 0 0 1px rgba(0,0,0,0.06), 0 16px 48px rgba(0,0,0,0.12);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-feature-settings: "cv02","cv03","cv04","cv11";
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-1);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      transition: background-color .25s, color .2s;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 38px 34px 30px;
      width: 100%; max-width: 400px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      transition: border-color .25s;
    }

    /* ── Logo ── */
    .logo { text-align: center; margin-bottom: 26px; }
    .logo-icon { font-size: 2.2rem; display: block; margin-bottom: 10px; line-height: 1; }
    .logo h1 {
      font-size: 1.15rem; font-weight: 800; letter-spacing: -0.3px;
      background: linear-gradient(135deg, #c4b5fd 0%, var(--accent) 55%, #60a5fa 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    html.light .logo h1 {
      background: linear-gradient(135deg, var(--accent) 0%, #4f46e5 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .logo p  { font-size: .78rem; color: var(--text-3); margin-top: 4px; }

    /* ── Stepper ── */
    .stepper {
      display: flex; align-items: center; gap: 0;
      margin-bottom: 24px;
    }
    .step { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 5px; }
    .step-circle {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .70rem; font-weight: 700;
      background: var(--accent-dim); color: var(--text-3);
      border: 1px solid var(--border);
      transition: background .3s, color .3s, border-color .3s, box-shadow .3s;
    }
    .step.active .step-circle  { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
    .step.done   .step-circle  { background: #10b981; color: #fff; border-color: #10b981; }
    .step-label { font-size: .65rem; color: var(--text-3); text-align: center; white-space: nowrap; }
    .step.active .step-label   { color: var(--accent); font-weight: 600; }
    .step-line { flex: 1; height: 1px; background: var(--border); margin: 0 4px; margin-bottom: 16px; }

    /* ── Fields ── */
    .field { margin-top: 16px; }
    label {
      display: block; font-size: .70rem; font-weight: 700;
      color: var(--text-3); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 6px;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 13px; color: var(--text-1);
      font-size: .91rem; font-family: inherit;
      outline: none; transition: border-color .18s, box-shadow .18s;
    }
    input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-dim); }
    input::placeholder { color: var(--text-3); }

    /* ── OTP boxes ── */
    .otp-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px; margin-top: 6px;
    }
    .otp-box {
      width: 100%; height: 46px; text-align: center;
      font-size: 1.3rem; font-weight: 800;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-1); outline: none;
      padding: 0; min-width: 0; font-family: 'SF Mono', 'Fira Code', monospace;
      transition: border-color .18s, box-shadow .18s;
    }
    .otp-box:focus { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--accent-dim); }

    /* ── Password strength ── */
    .strength { margin-top: 6px; height: 3px; border-radius: 2px; background: var(--bg-input); overflow: hidden; }
    .strength-bar { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0; }
    .strength-label { font-size: .70rem; color: var(--text-3); margin-top: 3px; }

    /* ── Button ── */
    .btn {
      width: 100%; margin-top: 22px; padding: 12px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 10px; font-size: .93rem; font-weight: 700;
      font-family: inherit; cursor: pointer;
      box-shadow: 0 0 18px var(--accent-glow);
      transition: background .18s, box-shadow .18s, transform .12s, opacity .15s;
    }
    .btn:hover   { background: var(--accent-h); box-shadow: 0 0 28px var(--accent-glow); }
    .btn:active  { transform: scale(.98); }
    .btn:disabled { background: var(--accent-dim); box-shadow: none; cursor: not-allowed; opacity: .7; }

    /* ── Messages ── */
    .msg {
      margin-top: 12px; padding: 9px 13px; border-radius: 9px;
      font-size: .83rem; display: none; line-height: 1.5;
    }
    .msg.show { display: block; }
    .msg.error { background: var(--error-bg); border: 1px solid var(--error-bd); color: var(--error-txt); }
    .msg.ok    { background: var(--ok-bg);    border: 1px solid var(--ok-bd);    color: var(--ok-txt); }

    /* ── Resend cooldown ── */
    .resend-row { margin-top: 12px; text-align: center; font-size: .78rem; color: var(--text-3); }
    .resend-row button {
      background: none; border: none; cursor: pointer; font-family: inherit;
      color: var(--accent); font-size: .78rem; font-weight: 500; text-decoration: underline;
    }
    .resend-row button:disabled { color: var(--text-3); text-decoration: none; cursor: default; }

    /* ── Theme & Footer ── */
    .theme-btn {
      position: fixed; top: 16px; right: 16px;
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text-2); font-size: .9rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      transition: background .18s, border-color .18s;
    }
    .theme-btn:hover { background: var(--accent-dim); border-color: var(--border-focus); }

    .divider { height: 1px; background: var(--border); margin: 20px 0 0; }
    .footer-note { text-align: center; margin-top: 14px; font-size: .73rem; color: var(--text-3); }
    .footer-note a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <button class="theme-btn" id="btn-theme">🌙</button>

  <div class="card">
    <div class="logo">
      <span class="logo-icon">🔑</span>
      <h1>Lupa Password</h1>
      <p>Reset password akun WAN Case Flow</p>
    </div>

    <!-- Stepper -->
    <div class="stepper">
      <div class="step active" id="step-ind-1">
        <div class="step-circle">1</div>
        <div class="step-label">Email</div>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step-ind-2">
        <div class="step-circle">2</div>
        <div class="step-label">Verifikasi &amp; Password</div>
      </div>
    </div>

    <!-- Step 1 -->
    <div id="step1">
      <div class="field">
        <label for="email">Email terdaftar</label>
        <input id="email" type="email" placeholder="nama@email.com" autocomplete="email" autofocus>
      </div>
      <button class="btn" id="btn-send">Kirim Kode Reset →</button>
      <div class="msg error" id="err1"></div>
    </div>

    <!-- Step 2 -->
    <div id="step2" style="display:none">
      <p style="font-size:.8rem;color:var(--text-2);margin-bottom:4px">
        Kode OTP dikirim ke <strong id="email-display" style="color:var(--text-1)"></strong>
      </p>

      <div class="field">
        <label>Kode OTP (6 digit)</label>
        <div class="otp-row" id="otp-row">
          <input class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>
      </div>

      <div class="field">
        <label for="new-pw">Password Baru</label>
        <input id="new-pw" type="password" placeholder="Min. 8 karakter" autocomplete="new-password">
        <div class="strength"><div class="strength-bar" id="str-bar"></div></div>
        <div class="strength-label" id="str-label"></div>
      </div>

      <div class="field">
        <label for="confirm-pw">Konfirmasi Password</label>
        <input id="confirm-pw" type="password" placeholder="Ulangi password baru" autocomplete="new-password">
      </div>

      <button class="btn" id="btn-reset" disabled>Reset Password</button>
      <div class="msg error" id="err2"></div>
      <div class="msg ok"    id="ok2"></div>

      <div class="resend-row">
        Tidak menerima kode?
        <button id="btn-resend" disabled>Kirim ulang (<span id="countdown">60</span>s)</button>
      </div>
    </div>

    <div class="divider"></div>
    <p class="footer-note">
      Ingat password? <a href="/login.html">Masuk di sini</a>
    </p>
  </div>

  <script>
    /* ── Theme ── */
    (function () {
      const saved = localStorage.getItem('wcf_theme');
      const preferLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(saved ? saved : (preferLight ? 'light' : 'dark'));
    })();
    function applyTheme(t) {
      const h = document.documentElement, btn = document.getElementById('btn-theme');
      t === 'light' ? (h.classList.remove('dark'), h.classList.add('light'))
                    : (h.classList.remove('light'), h.classList.add('dark'));
      if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙';
      localStorage.setItem('wcf_theme', t);
    }
    document.getElementById('btn-theme').addEventListener('click', () =>
      applyTheme(document.documentElement.classList.contains('light') ? 'dark' : 'light')
    );

    /* ── State ── */
    let userEmail = '';
    let cdTimer   = null;

    /* ── Step 1 — Kirim OTP ── */
    const btnSend = document.getElementById('btn-send');
    const err1    = document.getElementById('err1');

    btnSend.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email || !email.includes('@')) { showErr(err1, 'Masukkan email yang valid'); return; }
      err1.classList.remove('show');
      btnSend.disabled = true; btnSend.textContent = 'Mengirim…';
      try {
        const r    = await fetch('/api/auth/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const json = await r.json();
        if (json.ok) {
          userEmail = email;
          goStep2();
        } else {
          showErr(err1, json.error || 'Gagal mengirim kode');
          btnSend.disabled = false; btnSend.textContent = 'Kirim Kode Reset →';
        }
      } catch {
        showErr(err1, 'Tidak dapat menghubungi server');
        btnSend.disabled = false; btnSend.textContent = 'Kirim Kode Reset →';
      }
    });

    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') btnSend.click();
    });

    /* ── Step 2 — OTP boxes ── */
    const boxes = Array.from(document.querySelectorAll('.otp-box'));
    boxes.forEach((box, i) => {
      box.addEventListener('input', () => {
        box.value = box.value.replace(/\D/g,'').slice(-1);
        if (box.value && i < boxes.length - 1) boxes[i+1].focus();
        checkReady();
      });
      box.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !box.value && i > 0) boxes[i-1].focus();
        if (e.key === 'ArrowLeft'  && i > 0) boxes[i-1].focus();
        if (e.key === 'ArrowRight' && i < boxes.length-1) boxes[i+1].focus();
      });
      box.addEventListener('paste', e => {
        e.preventDefault();
        const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'');
        txt.split('').slice(0,6).forEach((ch, j) => { if (boxes[i+j]) boxes[i+j].value = ch; });
        const next = Math.min(i + txt.length, boxes.length - 1);
        boxes[next].focus();
        checkReady();
      });
    });

    /* ── Password strength ── */
    const newPwEl  = document.getElementById('new-pw');
    const confPwEl = document.getElementById('confirm-pw');
    newPwEl.addEventListener('input',  () => { strength(newPwEl.value); checkReady(); });
    confPwEl.addEventListener('input', checkReady);

    function strength(pw) {
      let s = 0;
      if (pw.length >= 8)  s++;
      if (/[0-9]/.test(pw)) s++;
      if (/[a-zA-Z]/.test(pw) && /[0-9]/.test(pw)) s++;
      if (pw.length >= 12) s++;
      const cols  = ['#ef4444','#f97316','#f59e0b','#10b981'];
      const names = ['Lemah','Cukup','Kuat','Sangat Kuat'];
      document.getElementById('str-bar').style.cssText =
        `width:${s ? s*25 : 0}%;background:${s ? cols[s-1] : ''}`;
      document.getElementById('str-label').textContent = s ? names[s-1] : '';
      return s;
    }

    function getOtp() { return boxes.map(b => b.value).join(''); }

    function checkReady() {
      const otp = getOtp();
      const pw  = newPwEl.value;
      const ok  = otp.length === 6 && pw.length >= 8 && pw === confPwEl.value;
      document.getElementById('btn-reset').disabled = !ok;
    }

    /* ── Step 2 — Reset ── */
    const btnReset = document.getElementById('btn-reset');
    const err2     = document.getElementById('err2');
    const ok2      = document.getElementById('ok2');

    btnReset.addEventListener('click', async () => {
      const otp = getOtp();
      const pw  = newPwEl.value;
      err2.classList.remove('show'); ok2.classList.remove('show');
      btnReset.disabled = true; btnReset.textContent = 'Memproses…';
      try {
        const r    = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail, otp, new_password: pw }),
        });
        const json = await r.json();
        if (json.ok) {
          ok2.textContent = '✓ Password berhasil direset! Mengalihkan ke halaman login…';
          ok2.classList.add('show');
          setTimeout(() => window.location.replace('/login.html'), 2000);
        } else {
          showErr(err2, json.error || 'Gagal reset password');
          btnReset.disabled = false; btnReset.textContent = 'Reset Password';
        }
      } catch {
        showErr(err2, 'Tidak dapat menghubungi server');
        btnReset.disabled = false; btnReset.textContent = 'Reset Password';
      }
    });

    /* ── Resend cooldown ── */
    function startCooldown() {
      let secs = 60;
      const btnR = document.getElementById('btn-resend');
      const cd   = document.getElementById('countdown');
      btnR.disabled = true; cd.textContent = secs;
      cdTimer = setInterval(() => {
        secs--;
        cd.textContent = secs;
        if (secs <= 0) {
          clearInterval(cdTimer);
          btnR.disabled = false;
          btnR.textContent = 'Kirim ulang';
        }
      }, 1000);
    }

    document.getElementById('btn-resend').addEventListener('click', async () => {
      document.getElementById('btn-resend').disabled = true;
      err2.classList.remove('show');
      try {
        const r    = await fetch('/api/auth/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail }),
        });
        const json = await r.json();
        if (json.ok) {
          boxes.forEach(b => b.value = '');
          boxes[0].focus();
          startCooldown();
        } else {
          showErr(err2, json.error || 'Gagal mengirim ulang');
          document.getElementById('btn-resend').disabled = false;
        }
      } catch {
        showErr(err2, 'Tidak dapat menghubungi server');
        document.getElementById('btn-resend').disabled = false;
      }
    });

    /* ── Helpers ── */
    function goStep2() {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = '';
      document.getElementById('email-display').textContent = userEmail;
      document.getElementById('step-ind-1').classList.remove('active');
      document.getElementById('step-ind-1').classList.add('done');
      document.getElementById('step-ind-2').classList.add('active');
      document.getElementById('step-ind-1').querySelector('.step-circle').textContent = '✓';
      boxes[0].focus();
      startCooldown();
    }

    function showErr(el, msg) {
      el.textContent = msg; el.classList.add('show');
    }
  </script>
</body>
</html>
