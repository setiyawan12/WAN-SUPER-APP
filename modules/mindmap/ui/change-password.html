<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAN Case Flow — Ganti Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #06060a;
      color: #f1f0ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 24px 16px;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(139,124,248,0.12), transparent);
      pointer-events: none;
    }
    .card {
      background: rgba(14,14,26,0.8);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      position: relative;
    }
    /* Logo / brand header */
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      font-size: 2rem; margin-bottom: 8px;
      filter: drop-shadow(0 0 16px rgba(139,124,248,0.5));
    }
    .brand-name {
      font-size: .7rem; font-weight: 800; letter-spacing: 2.5px;
      text-transform: uppercase; color: rgba(139,124,248,0.6);
    }
    .icon { font-size: 2.2rem; text-align: center; display: block; margin-bottom: 10px; }
    h1 { font-size: 1.2rem; font-weight: 700; color: #f1f0ff; text-align: center; margin-bottom: 6px; letter-spacing: -.3px; }
    .subtitle { font-size: .82rem; color: #6e6a8a; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: .7rem; font-weight: 700; color: #a8a4c0; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; margin-top: 18px; }
    input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      padding: 11px 14px;
      color: #f1f0ff;
      font-size: .93rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      font-family: 'Inter', system-ui, sans-serif;
    }
    input:focus {
      border-color: rgba(139,124,248,0.5);
      background: rgba(139,124,248,0.06);
      box-shadow: 0 0 0 3px rgba(139,124,248,0.12);
    }
    .strength { margin-top: 6px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.06); overflow: hidden; }
    .strength-bar { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0; }
    .strength-label { font-size: .7rem; color: #6e6a8a; margin-top: 3px; }
    .btn {
      width: 100%;
      margin-top: 28px;
      padding: 12px;
      background: #8b7cf8;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      font-family: 'Inter', system-ui, sans-serif;
      box-shadow: 0 4px 20px rgba(139,124,248,0.35);
    }
    .btn:hover  { background: #7c6dfa; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(139,124,248,0.45); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { background: rgba(139,124,248,0.2); color: rgba(255,255,255,0.3); cursor: not-allowed; transform: none; box-shadow: none; }
    #error-msg {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(239,68,68,.10);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: .84rem;
      display: none;
    }
    #error-msg.show { display: block; }
    .rules { margin-top: 8px; font-size: .72rem; color: #6e6a8a; line-height: 1.8; }
    .rules li { list-style: none; padding-left: 14px; position: relative; }
    .rules li::before { content: '·'; position: absolute; left: 0; }
    .rules li.ok { color: #34d399; }
    .rules li.ok::before { content: '✓'; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-logo">✦</div>
    <div class="brand-name">WAN Case Flow</div>
  </div>
  <span class="icon">🔑</span>
  <h1>Buat Password Baru</h1>
  <p class="subtitle">Buat password baru yang aman<br>untuk melanjutkan ke aplikasi.</p>

  <form id="form">
    <label for="new-pw">Password Baru</label>
    <input id="new-pw" type="password" placeholder="Masukkan password baru" autofocus>
    <div class="strength"><div class="strength-bar" id="str-bar"></div></div>
    <div class="strength-label" id="str-label"></div>
    <ul class="rules">
      <li id="r-len">Minimal 8 karakter</li>
      <li id="r-num">Mengandung angka</li>
      <li id="r-sym">Mengandung huruf &amp; angka</li>
    </ul>

    <label for="confirm-pw">Konfirmasi Password</label>
    <input id="confirm-pw" type="password" placeholder="Ulangi password baru">

    <button class="btn" type="submit" id="btn-submit" disabled>Simpan Password</button>
  </form>
  <div id="error-msg"></div>
</div>

<script>
  const TOKEN = localStorage.getItem('wcf_token') || '';
  if (!TOKEN) window.location.replace('/login.html');

  // Cek apakah memang harus ganti password
  (async () => {
    const r = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    const me = await r.json();
    // Jika tidak harus ganti password, redirect ke app
    if (!me.ok || !me.user?.must_change_password) {
      window.location.replace('/');
    }
  })();

  const newPwEl   = document.getElementById('new-pw');
  const confPwEl  = document.getElementById('confirm-pw');
  const strBar    = document.getElementById('str-bar');
  const strLabel  = document.getElementById('str-label');
  const btnSubmit = document.getElementById('btn-submit');
  const errEl     = document.getElementById('error-msg');

  function checkStrength(pw) {
    let score = 0;
    if (pw.length >= 8)  score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[a-zA-Z]/.test(pw) && /[0-9]/.test(pw)) score++;
    if (pw.length >= 12) score++;
    const colors  = ['#ef4444','#f97316','#f59e0b','#10b981'];
    const labels  = ['Lemah','Cukup','Kuat','Sangat Kuat'];
    const widths  = ['25%','50%','75%','100%'];
    strBar.style.width      = score ? widths[score-1] : '0';
    strBar.style.background = score ? colors[score-1] : '';
    strLabel.textContent    = score ? labels[score-1] : '';
    return score;
  }

  function validateRules(pw) {
    const rLen = document.getElementById('r-len');
    const rNum = document.getElementById('r-num');
    const rSym = document.getElementById('r-sym');
    const okLen = pw.length >= 8;
    const okNum = /[0-9]/.test(pw);
    const okSym = /[a-zA-Z]/.test(pw) && /[0-9]/.test(pw);
    rLen.className = okLen ? 'ok' : '';
    rNum.className = okNum ? 'ok' : '';
    rSym.className = okSym ? 'ok' : '';
    return okLen && okNum;
  }

  function updateBtn() {
    const pw   = newPwEl.value;
    const conf = confPwEl.value;
    const ok   = validateRules(pw) && pw === conf && pw.length >= 8;
    btnSubmit.disabled = !ok;
  }

  newPwEl.addEventListener('input', () => { checkStrength(newPwEl.value); updateBtn(); });
  confPwEl.addEventListener('input', updateBtn);

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = newPwEl.value;
    errEl.classList.remove('show');
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Menyimpan...';

    try {
      const r = await fetch('/api/profile', {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ new_password: pw }),
      });
      const json = await r.json();
      if (json.ok) {
        // Update localStorage user
        const user = JSON.parse(localStorage.getItem('wcf_user') || '{}');
        const isNewUser = !!user.must_change_password;
        user.must_change_password = false;
        localStorage.setItem('wcf_user', JSON.stringify(user));
        // User baru (signup via OTP atau dibuat admin) → onboarding
        window.location.replace(isNewUser ? '/?welcome=1' : '/');
      } else {
        errEl.textContent = json.error || 'Gagal menyimpan';
        errEl.classList.add('show');
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Simpan Password';
      }
    } catch {
      errEl.textContent = 'Tidak dapat menghubungi server';
      errEl.classList.add('show');
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Simpan Password';
    }
  });
</script>
</body>
</html>
