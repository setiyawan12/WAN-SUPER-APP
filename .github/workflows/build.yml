name: Release

# Builds signed/unsigned installers and publishes them to GitHub Releases.
# Trigger: push a version tag (v0.1.1, v1.0.0, …) or run manually from Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. 0.1.1). Empty = package.json version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Electron 43+ requires Node >= 22.12. Keep CI on the same major.
  NODE_VERSION: "22"

jobs:
  # ── macOS (DMG + ZIP, signed + notarized) ────────────────────────────────────
  build-mac:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download cloudflared (darwin-arm64)
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar xz
          chmod +x cloudflared
          mv cloudflared modules/net/cloudflared

      - name: Install dependencies
        # Skip lifecycle scripts so argon2/ssh2 do not compile from source.
        # argon2 ships N-API prebuilds in the npm tarball; electron binary is
        # fetched explicitly in the next step.
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          npm version "$VER" --no-git-tag-version --allow-same-version
          echo "Building version $VER"

      - name: Build (main + renderers + assets)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Import Apple signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "APPLE_CERT_P12 not set — mac build will be unsigned"
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Package, sign & notarize (DMG + ZIP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
        run: npx electron-builder --mac --publish always

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-dmg
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: warn

  # ── Windows (NSIS .exe, unsigned) ────────────────────────────────────────────
  build-win:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download cloudflared (windows-amd64)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "modules/net/cloudflared.exe"

      - name: Install dependencies
        # Windows runners often fail argon2/node-gyp source rebuilds (VS detection).
        # Use packaged N-API prebuilds instead of compiling native addons.
        shell: bash
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Download Electron binary
        shell: bash
        run: node node_modules/electron/install.js

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          npm version "$VER" --no-git-tag-version --allow-same-version
          echo "Building version $VER"

      - name: Build (main + renderers + assets)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Package EXE (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn

  # ── Linux (DEB + AppImage) ───────────────────────────────────────────────────
  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download cloudflared (linux-amd64)
        run: |
          curl -fsSL -o modules/net/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x modules/net/cloudflared

      - name: Install dependencies
        # Skip lifecycle scripts so argon2 does not compile from source.
        # electron binary is fetched explicitly in the next step.
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Compile node-pty for Linux
        # node-pty ships prebuilt binaries only for macOS/Windows in its npm
        # tarball — none for Linux. --ignore-scripts above skipped its build,
        # so build/Release/pty.node never gets produced and the SSH module
        # fails at runtime with "Cannot find module .../pty.node". node-pty is
        # N-API (ABI-stable), so compiling against the runner's Node works in
        # Electron too. ubuntu-latest already has build-essential + python3.
        run: npm rebuild node-pty

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          npm version "$VER" --no-git-tag-version --allow-same-version
          echo "Building version $VER"

      - name: Build (main + renderers + assets)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Package DEB + AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish always

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: warn

  # ── Finalize GitHub Release notes ────────────────────────────────────────────
  finalize-release:
    name: Finalize release
    needs: [build-mac, build-win, build-linux]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure GitHub Release exists & is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Release **${TAG}** of WAN Super App."
            echo ""
            echo "Installers are uploaded by electron-builder from the macOS / Windows / Linux jobs."
            echo ""
            echo "### Downloads"
            echo "- **macOS**: \`.dmg\` / \`.zip\` (arm64)"
            echo "- **Windows**: NSIS \`.exe\`"
            echo "- **Linux**: \`.deb\` / \`.AppImage\`"
            echo ""
            echo "### Changelog"
            echo "See commit history for \`${TAG}\`."
          } > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --title "WAN Super App $TAG" --notes-file "$NOTES_FILE" || true
          else
            gh release create "$TAG" \
              --title "WAN Super App $TAG" \
              --notes-file "$NOTES_FILE" \
              --verify-tag || \
            gh release create "$TAG" \
              --title "WAN Super App $TAG" \
              --generate-notes \
              --verify-tag || true
          fi
          echo "Release page: https://github.com/${{ github.repository }}/releases/tag/$TAG"
